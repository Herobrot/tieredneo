plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id "com.modrinth.minotaur" version "2.8.7"
    id "net.darkhax.curseforgegradle" version "1.1.25"
    id "com.github.breadmoirai.github-release" version "2.4.1"
}

tasks.named('wrapper', Wrapper).configure {

    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.terraformersmc.com/" }
    mavenCentral()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {

    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    java {
        withSourcesJar()
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {

            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {

        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation("me.shedaniel.cloth:cloth-config-neoforge:${cloth_config_version}")

    compileOnly "dev.emi:emi-neoforge:${emi_version}:api"
    runtimeOnly "dev.emi:emi-neoforge:${emi_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

def getChangelogText() {
    def changelogFile = file('CHANGELOG.md')
    if (!changelogFile.exists()) {
        return "No changelog found."
    }

    def text = changelogFile.text
    def matcher = text =~ /(?s)^(# .*?\n)(.*?)(?=\n# |\n---|\Z)/

    if (matcher.find()) {
        return matcher.group(2).trim()
    }
    return text.trim()
}

githubRelease {
    token = System.getenv("GITHUB_TOKEN") ?: ""
    owner = "Herobrot"
    repo = "TieredNeo"
    tagName = "${project.version}+${minecraft_version}"
    targetCommitish = "main"
    releaseName = "TieredNeo ${project.version}+${minecraft_version}"
    body = getChangelogText()
    releaseAssets(jar)
}

modrinth {
    token.set(System.getenv("MODRINTH_TOKEN") ?: "")
    projectId.set("tieredneo")
    versionNumber.set("${project.version}+${minecraft_version}")
    versionName.set("Hero's Tiered ${project.version}")
    versionType.set("release")
    gameVersions.set(["1.21.1"])
    loaders.set(["neoforge"])
    changelog.set(getChangelogText())
    uploadFile.set(tasks.named("jar"))

    dependencies {
        required.project("cloth-config")
    }
}

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    dependsOn tasks.named("jar")
    group = 'publishing'
    apiToken = System.getenv('CURSEFORGE_TOKEN') ?: "0"

    def uploadFile = upload("heros-tiered", jar.archiveFile.get().asFile)

    uploadFile.displayName = "Hero's Tiered"
    uploadFile.changelog = getChangelogText()
    uploadFile.changelogType = 'markdown'
    uploadFile.addModLoader('NeoForge')
    uploadFile.addGameVersion('1.21.1')
    uploadFile.addGameVersion('Client', 'Server')
    uploadFile.addJavaVersion('Java 21')
    uploadFile.releaseType = 'release'

    uploadFile.addRequirement('cloth-config')
}

tasks.register("publishMod") {
    group = "publishing"
    description = "Construye el mod y lo distribuye de forma automatizada."
    dependsOn build

    if (System.getenv("GITHUB_TOKEN") != null) finalizedBy tasks.named("githubRelease")
    if (System.getenv("CURSEFORGE_TOKEN") != null) finalizedBy tasks.named("curseforge")
    if (System.getenv("MODRINTH_TOKEN") != null) finalizedBy tasks.named("modrinth")
}